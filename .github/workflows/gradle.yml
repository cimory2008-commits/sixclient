name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Create Gradle Wrapper
      run: |
        cd sixclientui
        gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod -R 777 ./sixclientui

    - name: Build Mod File
      run: |
        cd sixclientui
        ./gradlew build -x test --no-daemon

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: SixClientUI-JAR
        path: sixclientui/build/libs/*.jar
